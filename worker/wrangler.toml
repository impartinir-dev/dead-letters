# Cloudflare Worker for DEAD LETTERS global daily stats. Setup: worker/README.md
name = "dead-letters-stats"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Origins allowed to call the API (the game's site + local dev servers).
[vars]
ALLOWED_ORIGINS = "https://impartinir-dev.github.io,http://localhost:5173,http://localhost:5174"

[[d1_databases]]
binding = "DB"
database_name = "dead-letters-stats"
database_id = "1fa5cedd-9f75-4ec9-87d6-cc602c6f1ab5"

# At most 30 submissions per minute per IP (mobile carriers share IPs; checked
# in memory, never stored). Each player submits once per daily case.
[[ratelimits]]
name = "SUBMIT_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 30
  period = 60
